name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro check 等だけでは import 漏れを見逃した前例があるので、tsc を必ず通す
      - name: Type check
        run: npm run typecheck

      # パーサ・JWT 検証のテスト（実ページ由来のフィクスチャは CI に無いので、その分は skip される）
      - name: Test
        run: npm test

      # 必要なシークレット: CLOUDFLARE_API_TOKEN（Workers Scripts:Edit + D1:Edit）/ CLOUDFLARE_ACCOUNT_ID
      # wranglerVersion は package.json の devDependencies.wrangler と揃えること
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.131.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fukuoka-condo-watch --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.131.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
