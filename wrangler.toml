name = "fukuoka-condo-watch"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 公開ダッシュボード（データは国交省の公開情報のみ。個人情報は載せない）
# ⚠️ /listings・/api/listings は非公開。workers.dev 側は Access を掛けない（公開の / を残すため）ので、
#    Worker 側の JWT 検証（src/access.ts）が fail-closed で止める。Access が前に立つのは下のカスタムドメイン側。
workers_dev = false

# /listings を Cloudflare Access で守るためのカスタムドメイン（README「掲載情報（SUUMO）」）。
# scripts/access-app.ts に渡す ACCESS_HOSTNAME と揃えること。2026-09-14 に有効化。
[[routes]]
pattern = "condo.kechiiiiin.com"
custom_domain = true

[observability]
enabled = true

# Workers Paid 前提（掲載クロールで HTML を解析するため）。Free プランでは cpu_ms を指定するとデプロイが失敗する。
# 30 秒 = Paid の既定上限（1 時間未満間隔の Cron と同じ）。
[limits]
cpu_ms = 30000

# cron は 2 系統（src/index.ts が controller.cron で振り分ける）:
#
# 1) "*/5 19-23 * * *" … 国交省 XIT001 の取り込み。毎日 04:00〜08:55 JST（= 19:00〜23:55 UTC）に 5 分おき起動する（60 回）。
#    1 回あたりの API 呼び出しは 3 件に刻み（無料プランの CPU 10ms 上限対策）、
#    「JST の今日まだ取れていない (市区町村, 四半期)」だけを順に取る。取り切った後の起動は即終了。
#    容量: 直近 6 四半期 × 23 市区町村 = 138 件/日 に対し 60 回 × 3 件 = 180 件/日（再試行の余裕 42 件）。
#      2026-09-14 に近郊 16 市町を足すまでは `*/5 21-22`（24 回 × 3 = 72 件）で、138 件には足りなかった。
#      バッチを増やすと 1 起動の CPU が 10ms を超えうるので、起動回数の方を増やした。詳細は src/ingest.ts。
#    何度走っても結果は同じ（冪等）。数年分の初回投入は Worker ではなく scripts/backfill.ts で行う。
#
# 2) "*/15 16-20 * * *" … 掲載情報（SUUMO）。01:00〜05:45 JST に 15 分おき 20 起動。**LISTINGS_ENABLED が on のときだけ動く**
#    （off・external なら D1 にも触らず即 return）。Workers Paid 前提（1 起動 10 分で切り上げ・約 19 ページ・30 秒間隔）。
#    1 日 ≒ 231 ページ → 13 起動ほどで終わり、残りは再開の余裕。src/listing-crawl.ts の LISTINGS_CRON と一致させること。
#    ⚠️ 2026-09-22 から本番は external（Mac の launchd が取る）なので、この cron は起動しても即 return する。
#       on に戻せばそのまま使えるよう、トリガーは残してある。
[triggers]
crons = ["*/5 19-23 * * *", "*/15 16-20 * * *"]

[vars]
# 掲載クロールの取り方（src/listing-crawl-core.ts の listingsMode・README「掲載情報（SUUMO）」）:
#   "off"      … 何もしない
#   "on"       … Worker の cron が SUUMO を取る（Cloudflare の送信元が 503 で弾かれたため 2026-09-22 にやめた）
#   "external" … Mac（ops/launchd/・毎日 01:00 JST）が取って POST /api/listings/ingest に送る。cron は取らない
#                取り込みの認証は secret LISTINGS_INGEST_TOKEN（未設定なら全員 401）
LISTINGS_ENABLED = "external"
# Access アプリ「fukuoka-condo-watch listings」（2026-09-14 に scripts/access-app.ts で作成）の値。秘密ではない。ALLOWED_EMAILS は secret
CF_ACCESS_TEAM_DOMAIN = "https://kechiiiiin.cloudflareaccess.com"
CF_ACCESS_AUD = "786b6144ce3802310060fb9c63ba605a97275588caa0fa612a5215a109f89858"

[[d1_databases]]
binding = "DB"
database_name = "fukuoka-condo-watch"
database_id = "b4a51475-2441-43d5-9b3c-5b4fc40c4e9b"
migrations_dir = "migrations"

# 秘密は `wrangler secret put` で登録する（リポジトリには書かない）:
#   REINFOLIB_API_KEY … 不動産情報ライブラリ API キー（未設定でも動く。画面に「APIキー未設定」）
#   ALLOWED_EMAILS    … /listings を見てよいメール（カンマ区切り）。未設定なら /listings は全員 403
#   LISTINGS_INGEST_TOKEN … Mac 側クローラの取り込み用（32 文字以上）。未設定なら /api/listings/ingest は全員 401
#                           ops/setup-ingest-token.sh が生成して secret と Mac の ~/.config/fukuoka-condo-watch/env の両方に置く
# e-Stat のアプリケーション ID は Worker には渡さない（scripts/estat.ts がローカルで使う。.dev.vars に置く）。
